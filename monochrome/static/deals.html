<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mono Deals</title><style>
:root{color-scheme:dark;--bg:#101112;--panel:#191a1c;--raised:#232427;--line:#383a3e;--text:#fff;--muted:#aaaeb6;--green:#72bc8f;--blue:#5e9fe8;--gold:#eac26b;--red:#e97366}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;background:rgba(16,17,18,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.head,.filters,.wrap{max-width:1500px;margin:auto}.head{min-height:64px;display:flex;align-items:center;gap:16px;padding:10px 20px}.brand{font-size:20px;font-weight:900}.brand b{color:var(--green)}.meta{color:var(--muted)}.nav{margin-left:auto;display:flex;gap:8px}.btn,.nav a,select,input{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0 12px;font:inherit;font-weight:700}.nav a,.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#08111d}.btn.buy{background:var(--green);border-color:var(--green);color:#07120b}.btn:disabled{opacity:.45;cursor:not-allowed}.filters{display:flex;gap:8px;padding:0 20px 12px;flex-wrap:wrap}.wrap{padding:16px 20px 40px}.settings{display:none;margin-bottom:16px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px}.settings.open{display:block}.settings h2{margin:0 0 14px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px}.field label{display:block;color:var(--muted);margin-bottom:6px;font-size:12px}.field input{width:100%}.markets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.market{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--raised)}.market strong{display:flex;justify-content:space-between}.market small{display:block;color:var(--muted);margin-top:5px}.toggle{display:flex;align-items:center;gap:8px;margin-top:10px}.toggle input{min-height:auto;width:18px;height:18px}.table{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:900px}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:11px;background:#141517}td{padding:9px 11px;border-top:1px solid #2c2e32;vertical-align:middle}tr:hover{background:var(--raised)}.gift{display:flex;align-items:center;gap:12px;min-width:280px}.pic{width:58px;height:58px;border-radius:10px;object-fit:contain;padding:3px}.name{font-weight:850}.sub{margin-top:3px;color:var(--muted);font-size:12px}.score{font-size:18px;font-weight:900;color:var(--green)}.price{font-weight:850}.premium{font-weight:850;color:var(--gold)}.premium.negative{color:var(--green)}.actions{display:flex;gap:8px}.open{color:var(--text);border:1px solid var(--line);text-decoration:none;padding:10px 12px;border-radius:8px;white-space:nowrap}.empty{padding:56px 20px;text-align:center;color:var(--muted)}.notice{margin-top:10px;color:var(--muted)}.error{color:var(--red)}:focus-visible{outline:3px solid rgba(94,159,232,.45);outline-offset:2px}@media(max-width:850px){.meta{display:none}.head,.filters,.wrap{padding-left:12px;padding-right:12px}.grid,.markets{grid-template-columns:1fr}.nav a:first-child{display:none}}
</style></head><body><header class="top"><div class="head"><div class="brand">MONO <b>DEALS</b></div><div class="meta" id="meta">75+ · до +13% к флору</div><nav class="nav"><a href="/top">Топ</a><a href="/inventory">Инвентарь</a><a href="/">Конструктор</a><button class="btn" id="settingsBtn">Управление</button></nav></div><div class="filters"><select id="collection"><option value="">Все 10 коллекций</option><option>Liberty Figure</option><option>Chill Flame</option><option>Vice Cream</option><option>Snoop Dogg</option><option>Jack-in-the-Box</option><option>Fine Pen</option><option>Lunar Snake</option><option>Lol Pop</option><option>Ice Cream</option><option>Instant Ramen</option></select><select id="score"><option value="75">Рейтинг 75+</option><option value="80">Рейтинг 80+</option><option value="85">Рейтинг 85+</option><option value="90">Рейтинг 90+</option></select></div></header><main class="wrap"><section class="settings" id="settings"><h2>Скупка и автовыставление</h2><div class="grid"><div class="field"><label>Минимальный рейтинг</label><input id="minScore" type="number" min="75" max="100" step="1"></div><div class="field"><label>Максимум к флору, %</label><input id="maxPremium" type="number" min="0" max="200" step="0.1"></div><div class="field"><label>Наценка при автовыставлении, %</label><input id="markup" type="number" min="0" max="500" step="1"></div><div class="field"><label>Задержка автовыставления, сек.</label><input id="delay" type="number" min="0" max="86400" step="1"></div></div><div class="markets" id="markets"></div><button class="btn primary" id="save">Сохранить настройки</button><div class="notice" id="notice">Ручная покупка на всех маркетах работает даже при выключенной автоскупке. После покупки автовыставление выполняется всегда.</div></section><div class="table"><table><thead><tr><th>Гифт</th><th>Рейтинг</th><th>Цена</th><th>Флор</th><th>К флору</th><th>Рынок</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">Загружаю подходящие лоты…</div></div></main><script>
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:3});let busy=false,settings=null,token=sessionStorage.getItem('monoAdminToken')||'';
const auth=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});
function row(x){const p=Number(x.premium_pct),pc=p<0?'premium negative':'premium',bg=`linear-gradient(145deg,${esc(x.center_color)},${esc(x.edge_color)})`,can=['MRKT','PORTALS','TONNEL'].includes(x.market)&&token;return `<tr><td><div class="gift"><img class="pic" style="background:${bg}" src="${esc(x.image_url)}" alt=""><div><div class="name">${esc(x.collection)} #${esc(x.number)}</div><div class="sub">${esc(x.model)} × ${esc(x.backdrop)} · ${esc(x.symbol||'')}</div></div></div></td><td><div class="score">${num(x.score)}</div><div class="sub">mono ${num(x.mono_score)}</div></td><td class="price">${num(x.price)} TON</td><td>${num(x.floor)} TON</td><td class="${pc}">${p>0?'+':''}${num(p)}%</td><td>${esc(x.market)}<div class="sub">${num(x.age_seconds)}с назад</div></td><td><div class="actions"><button class="btn buy" ${can?'':'disabled'} onclick="buy('${esc(x.market)}','${esc(x.listing_id)}',this)">Купить</button><a class="open" href="${esc(x.gift_url)}" target="_blank" rel="noopener">Открыть ↗</a></div></td></tr>`}
async function load(){if(busy)return;busy=true;try{const q=new URLSearchParams({min_score:$("score").value,max_premium:String(settings?.max_premium_pct??13),limit:'300'});if($("collection").value)q.set('collection',$("collection").value);const r=await fetch('/api/deals?'+q),d=await r.json();if(!r.ok)throw Error(d.detail||r.status);$('rows').innerHTML=d.items.map(row).join('');$('empty').style.display=d.items.length?'none':'block';$('empty').textContent='Сейчас нет свежих лотов по выбранным условиям';$('meta').textContent=`${d.total} лотов · ${num(d.min_score)}+ · до +${num(d.max_premium)}% к флору`}catch(e){$('empty').style.display='block';$('empty').textContent='Ошибка: '+e.message}finally{busy=false}}
async function status(promptKey=false){const r=await fetch('/api/trading/status',{headers:auth()}),d=await r.json();if(!r.ok){sessionStorage.removeItem('monoAdminToken');token='';throw Error(d.detail||'Ошибка авторизации')}settings=d.settings;$('minScore').value=settings.min_score;$('maxPremium').value=settings.max_premium_pct;$('markup').value=settings.relist_markup_pct;$('delay').value=settings.list_delay_seconds;$('markets').innerHTML=Object.entries(d.markets).map(([k,v])=>`<div class="market"><strong>${k.toUpperCase()} <span>${v.balance_ton==null?'—':num(v.balance_ton)+' TON'}</span></strong><small>${esc(v.state)}${v.eligible_count!=null?' · кандидатов: '+v.eligible_count:''}</small><label class="toggle"><input id="auto_${k}" type="checkbox" ${v.auto_enabled?'checked':''} ${v.supported?'':'disabled'}> Автоскупка</label></div>`).join('');$('settings').classList.add('open');load()}
$('settingsBtn').onclick=()=>status(!token).catch(e=>alert(e.message));$('save').onclick=async()=>{const body={min_score:+$('minScore').value,max_premium_pct:+$('maxPremium').value,relist_markup_pct:+$('markup').value,list_delay_seconds:+$('delay').value,auto_buy:{mrkt:$('auto_mrkt').checked,portals:$('auto_portals').checked,tonnel:$('auto_tonnel').checked}},r=await fetch('/api/trading/settings',{method:'POST',headers:auth(),body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.detail||'Ошибка');settings=d.settings;$('score').value=String(Math.round(settings.min_score));$('notice').textContent='Настройки сохранены';load()};
async function buy(market,id,btn){if(!confirm(`Купить лот ${market}? Цена и лимиты будут перепроверены перед покупкой.`))return;btn.disabled=true;const r=await fetch('/api/trading/buy',{method:'POST',headers:auth(),body:JSON.stringify({market,listing_id:id})}),d=await r.json();alert(d.message||d.detail||'Запрос отправлен');if(!r.ok)btn.disabled=false}
$('collection').onchange=load;$('score').onchange=load;load();if(token)status().catch(()=>{});setInterval(load,5000);setInterval(()=>{if(token)status().catch(()=>{})},15000);
</script></body></html>
