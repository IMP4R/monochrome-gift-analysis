<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mono Tests — монохром?</title>
<style>
:root{--bg:#0e1116;--panel:#171c24;--line:#262d38;--txt:#e6e9ee;--dim:#8b93a1;--good:#3ddc84;--bad:#ff5b5b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}header h1{font-size:15px;margin:0}.cnt{color:var(--dim);font-size:12px}q{display:block;text-align:center;margin:8px 0;font-size:14px}.stackzone{flex:1;position:relative;display:flex;align-items:center;justify-content:center}#stack{position:relative;width:min(100vw,520px,calc(100vh - 190px));aspect-ratio:1;touch-action:none}.stackzone,#stack{touch-action:none;overscroll-behavior:none}.gcard{position:absolute;inset:0;border-radius:16px;border:1px solid var(--line);background:#11141a center/cover no-repeat;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px #000a;touch-action:none;user-select:none}.gcard img{width:80%;height:80%;object-fit:contain;filter:drop-shadow(0 8px 18px #0009);pointer-events:none}.stamp{position:absolute;top:14px;font-size:19px;font-weight:800;padding:4px 12px;border:3px solid;border-radius:10px;opacity:0}.stamp.yes{left:12px;color:var(--good);border-color:var(--good);transform:rotate(-12deg)}.stamp.no{right:12px;color:var(--bad);border-color:var(--bad);transform:rotate(12deg)}.capbar{text-align:center;padding:10px 14px 4px;font-size:13px;min-height:38px}.meta{color:var(--dim);font-size:11px}.actions{display:flex;gap:14px;padding:10px 14px 22px;justify-content:center}.rbtn{min-width:138px;height:54px;border-radius:28px;border:2px solid var(--line);background:var(--panel);font-size:14px;font-weight:650;display:flex;align-items:center;justify-content:center;cursor:pointer}.rbtn.yes{border-color:var(--good);color:var(--good)}.rbtn.no{border-color:var(--bad);color:var(--bad)}#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
</style></head><body>
<header><h1>Mono Model · критика</h1><span class="cnt" id="cnt">0</span></header><q>Модель считает это монохромом. Она права?</q><div class="stackzone"><div id="stack"></div><div id="status">Загружаю…</div></div><div class="capbar" id="capbar"></div><div class="actions"><div class="rbtn no" id="no">Нет монохрома</div><div class="rbtn yes" id="yes">Есть монохром</div></div>
<script type="module">
const $=id=>document.getElementById(id);let SESSION=localStorage.getItem("mono_tests_v6_session");if(!SESSION){SESSION=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("mono_tests_v6_session",SESSION)}let CUR=null,BUSY=false,COUNT=0,cardEl=null,cardRef=null,stack=null,DIRECTION=null;
const SWIPE_TRIGGER_RATIO=.15;try{const Swing=await import("https://esm.sh/swing@3.1.4");DIRECTION=Swing.Direction;stack=Swing.Stack({allowedDirections:[DIRECTION.LEFT,DIRECTION.RIGHT],throwOutConfidence:(x,y,e)=>Math.min(Math.abs(x)/(e.offsetWidth*SWIPE_TRIGGER_RATIO),1),isThrowOut:(x,y,e,confidence)=>Math.abs(x)>=e.offsetWidth*SWIPE_TRIGGER_RATIO});stack.on("throwout",e=>cast(e.throwDirection===DIRECTION.RIGHT?"monochrome":"not_monochrome"));stack.on("throwoutend",e=>e.target.remove());stack.on("dragmove",e=>{const yes=e.target.querySelector(".stamp.yes"),no=e.target.querySelector(".stamp.no");if(yes)yes.style.opacity=Math.max(0,Math.min(1,e.offset/(e.target.offsetWidth*SWIPE_TRIGGER_RATIO)));if(no)no.style.opacity=Math.max(0,Math.min(1,-e.offset/(e.target.offsetWidth*SWIPE_TRIGGER_RATIO)))})}catch(e){console.warn("Swing CDN недоступен, только кнопки",e)}
async function fetchOne(){const r=await fetch("/api/tests/swipe?session="+encodeURIComponent(SESSION));if(!r.ok)throw new Error(await r.text());return r.json()}
let NEXT_PROMISE=null,LAST_KEY="";
function preloadUrl(src){return new Promise(resolve=>{if(!src)return resolve();const im=new Image();let done=false;const finish=()=>{if(!done){done=true;resolve()}};im.onload=finish;im.onerror=finish;im.decoding="async";im.src=src;if(im.complete)finish();setTimeout(finish,6000)})}
async function prepareOne(){let d=await fetchOne();if(LAST_KEY&&d.a&&d.a.item_key===LAST_KEY)d=await fetchOne();await Promise.all([preloadUrl(d.a&&d.a.model_img),preloadUrl(d.a&&d.a.bg_url)]);return d}
function renderCard(d){CUR=d;const c=d.a;$("status").style.display="none";const el=document.createElement("div");el.className="gcard";el.style.backgroundImage=`url('${c.bg_url}')`;el.innerHTML=(c.model_img?`<img src="${c.model_img}" draggable="false" decoding="async" fetchpriority="high">`:"")+`<div class="stamp yes">МОНОХРОМ</div><div class="stamp no">НЕТ</div>`;$("stack").appendChild(el);cardEl=el;$("capbar").innerHTML=`${c.model} × ${c.backdrop}<div class="meta">${d.collection}</div>`;if(stack)cardRef=stack.createCard(el)}
function fly(dir){if(!cardEl)return;const el=cardEl;cardEl=null;el.style.transition="transform .28s ease-in,opacity .28s";el.style.transform=`translate(${dir*150}vw,-20px) rotate(${dir*24}deg)`;el.style.opacity="0";setTimeout(()=>el.remove(),300)}
async function cast(choice){if(BUSY||!CUR)return;BUSY=true;const rec={session:SESSION,task:CUR.task,presentation_id:CUR.presentation_id,collection:CUR.collection,short:CUR.short,choice,a:CUR.a};COUNT++;$("cnt").textContent=COUNT;try{await fetch("/api/tests/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)})}catch(e){}setTimeout(next,240)}
async function next(){BUSY=false;try{const pending=NEXT_PROMISE||prepareOne();NEXT_PROMISE=null;const d=await pending;LAST_KEY=(d.a&&d.a.item_key)||"";renderCard(d);NEXT_PROMISE=prepareOne()}catch(e){NEXT_PROMISE=null;$("status").style.display="flex";$("status").textContent="Ошибка: "+e.message}}
$("yes").onclick=()=>{if(BUSY||!CUR)return;if(stack&&cardRef){cast("monochrome");cardRef.throwOut(DIRECTION.RIGHT)}else{fly(1);cast("monochrome")}};$("no").onclick=()=>{if(BUSY||!CUR)return;if(stack&&cardRef){cast("not_monochrome");cardRef.throwOut(DIRECTION.LEFT)}else{fly(-1);cast("not_monochrome")}};next();
</script></body></html>
