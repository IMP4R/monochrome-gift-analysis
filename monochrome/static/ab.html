<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mono Tests — выбор цвета</title>
<style>
:root{--bg:#0e1116;--panel:#171c24;--line:#262d38;--txt:#e6e9ee;--dim:#8b93a1;--acc:#5aa9ff;--good:#3ddc84;--bad:#ff6b6b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}header h1{font-size:15px;margin:0}.cnt{color:var(--dim);font-size:12px}q{display:block;text-align:center;margin:10px 12px 2px;font-size:14px}.hint{text-align:center;color:var(--dim);font-size:12px;margin:0 12px 8px}.arena{flex:1;display:flex;gap:10px;padding:8px 14px;align-items:stretch;justify-content:center}.opt{flex:1;max-width:46vw;display:flex;flex-direction:column;cursor:pointer;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#11141a;transition:.12s}.opt:active{transform:scale(.97)}.opt.picked{border-color:var(--good)}.gcard{width:100%;aspect-ratio:1;background:#11141a center/cover no-repeat;display:flex;align-items:center;justify-content:center}.gcard img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 8px 18px #0009)}.cap{padding:9px;text-align:center;font-size:13px}.meta{color:var(--dim);font-size:11px}.actions{display:flex;gap:8px;padding:12px 14px 18px;justify-content:center}.btn{padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px;text-align:center;cursor:pointer}.btn.eq{border-color:var(--acc)}.btn.neither{border-color:var(--bad)}#status{text-align:center;color:var(--dim);padding:30px}@media(max-width:520px){.arena{padding:6px;gap:6px}.opt{max-width:49vw}.cap{font-size:11px}.actions{flex-wrap:wrap}}
</style></head><body>
<header><h1>Mono Tests · топы цветов</h1><span class="cnt" id="cnt">0</span></header>
<q>Какой цвет монохрома лучше смотрится в целом?</q>
<div class="hint" id="hint">Сравниваются монохромы из топ-10 разных цветов и разные модели</div>
<div class="arena" id="arena"></div><div class="actions"><div class="btn eq" id="equal">Одинаково</div><div class="btn neither" id="neither">Ни один</div><div class="btn" id="skip">Пропустить</div></div><div id="status" style="display:none">Загружаю…</div>
<script>
const $=id=>document.getElementById(id);let SESSION=localStorage.getItem("mono_tests_v6_ab_session");if(!SESSION){SESSION=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("mono_tests_v6_ab_session",SESSION)}let CUR=null,BUSY=false,COUNT=0;
function cardHtml(c){return `<div class="gcard" style="background-image:url('${c.bg_url}')">${c.model_img?`<img src="${c.model_img}">`:""}</div><div class="cap"><b>${c.backdrop}</b><div class="meta">${c.color_family} · ${c.model} · ${c.collection}</div></div>`}
async function next(){BUSY=false;try{const r=await fetch("/api/tests/ab");if(!r.ok)throw new Error(await r.text());CUR=await r.json();$("hint").textContent=`${CUR.family_a.toUpperCase()} × ${CUR.family_b.toUpperCase()} · случайные позиции из топ-10 · разные модели`;const arena=$("arena");arena.innerHTML="";for(const side of ["a","b"]){const el=document.createElement("div");el.className="opt";el.innerHTML=cardHtml(CUR[side]);el.onclick=()=>cast(side,el);arena.appendChild(el)}}catch(e){$("status").style.display="block";$("status").textContent="Ошибка: "+e.message}}
async function cast(choice,el){if(BUSY||!CUR)return;BUSY=true;if(el)el.classList.add("picked");const rec={session:SESSION,task:CUR.task,presentation_id:CUR.presentation_id,collection:CUR.collection,short:CUR.short,choice,a:CUR.a,b:CUR.b};COUNT++;$("cnt").textContent=COUNT;setTimeout(next,260);try{await fetch("/api/tests/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)})}catch(e){}}
$("equal").onclick=()=>cast("equal");$("neither").onclick=()=>cast("neither");$("skip").onclick=()=>cast("skip");next();
</script></body></html>
