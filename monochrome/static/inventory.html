<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои подарки</title><style>
:root{color-scheme:dark;--bg:#101112;--panel:#191a1c;--raised:#232427;--line:#383a3e;--text:#fff;--muted:#aaaeb6;--green:#72bc8f;--blue:#5e9fe8;--gold:#eac26b;--red:#e97366}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;background:rgba(16,17,18,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.head,.wrap{max-width:1500px;margin:auto}.head{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 20px}.brand{font-size:20px;font-weight:900}.brand b{color:var(--green)}.nav{margin-left:auto;display:flex;gap:8px}.btn,.nav a,select{min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0 12px;font:inherit;font-weight:750}.nav a,.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.btn.active{background:var(--blue);border-color:var(--blue);color:#08111d}.wrap{padding:18px 20px 50px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.sum{padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.sum strong{display:flex;justify-content:space-between;font-size:16px}.sum small{display:block;color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}.card{display:grid;grid-template-columns:112px minmax(0,1fr);gap:15px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}.visual{position:relative;width:112px;height:112px;border-radius:11px;overflow:hidden;background:linear-gradient(145deg,#303238,#161719);isolation:isolate}.visual .back{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.visual .model{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;z-index:1;filter:drop-shadow(0 5px 7px rgba(0,0,0,.24))}.name{font-weight:850;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{color:var(--muted);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;min-width:0}.actions{display:grid;grid-template-columns:minmax(140px,1fr) auto;align-items:center}.actions .generate{width:100%;min-height:38px}.actions .copytext{min-height:38px}.actions .generated{grid-column:1/-1;text-align:right;margin-top:1px;white-space:nowrap}.price{white-space:nowrap;font-size:14px}.foot{padding-top:2px}.badge{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;color:var(--green)}.badge.listed{color:var(--gold)}.price{font-weight:900}.generate{border:0;border-radius:8px;background:#5e9fe8;color:#07111d;padding:7px 9px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.generate:disabled{opacity:.55;cursor:wait}.generated{color:#72bc8f;font-size:12px;text-decoration:none}.copytext{border:1px solid #4d805f;border-radius:7px;background:#20382a;color:#a9ebc0;padding:7px 9px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}.modal.show{display:grid}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px;border:1px solid var(--line);border-radius:16px;background:#181a1d;box-shadow:0 24px 90px #000}.modaltop{display:flex;align-items:center;justify-content:space-between;gap:12px}.modal h2{margin:0;font-size:20px}.x{border:0;background:transparent;color:#aaa;font-size:25px;cursor:pointer}.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:15px 0}.field{display:grid;gap:5px;color:var(--muted);font-size:12px}.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:#101214;color:#fff;padding:0 10px;font:inherit}.check{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:#ddd}.listingtext{width:100%;min-height:430px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:#0f1113;color:#fff;padding:14px;font:14px/1.48 ui-monospace,SFMono-Regular,Menlo,monospace}.modalactions{display:flex;gap:9px;margin-top:10px}.modalactions .btn{flex:1}@media(max-width:650px){.settings{grid-template-columns:1fr}.listingtext{min-height:390px}}.meter{height:5px;background:#303237;border-radius:9px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#5e9fe8,#72bc8f)}.price{font-weight:900}.open{display:inline-block;color:var(--text);text-decoration:none;border-bottom:1px solid var(--muted);font-size:12px}.empty{text-align:center;color:var(--muted);padding:60px 20px}.error{color:var(--red)}@media(max-width:760px){.head,.wrap{padding-left:12px;padding-right:12px}.summary{grid-template-columns:1fr 1fr}.nav a:first-child{display:none}.grid{grid-template-columns:1fr}.card{grid-template-columns:100px minmax(0,1fr)}.visual{width:100px;height:100px}}@media(max-width:480px){.summary{grid-template-columns:1fr}.card{grid-template-columns:84px minmax(0,1fr);gap:11px;padding:11px}.visual{width:84px;height:84px}.actions{grid-template-columns:1fr}.actions .copytext{grid-row:2}.actions .generated{grid-row:3}.name{font-size:14px}.price{font-size:13px}}
</style></head><body><header class="top"><div class="head"><div class="brand">МОИ <b>ПОДАРКИ</b></div><div class="nav"><a href="/top">Топ</a><a href="/deals">Скупка</a><button class="btn" id="key">Ключ</button></div></div></header><main class="wrap"><div class="controls"><button class="btn active" data-view="all">Все</button><button class="btn" data-view="inventory">В инвентаре</button><button class="btn" data-view="listed">Выставленные</button><select id="market"><option value="">Все маркеты</option><option value="mrkt">MRKT</option><option value="portals">Portals</option><option value="tonnel">Tonnel</option></select><button class="btn" id="refresh">Обновить</button></div><div class="summary" id="summary"></div><div class="grid" id="grid"></div><div class="empty" id="empty">Загрузка…</div></main><div class="modal" id="textModal"><div class="modalbox"><div class="modaltop"><h2>Текст объявления</h2><button class="x" id="closeText">×</button></div><div class="settings"><label class="field">Курс расчёта, ₽<input id="rubTon" type="number" min="1" step="1" value="130"></label><label class="field">Коэффициент цены<input id="priceMult" type="number" min="1" step="0.05" value="1"></label></div><label class="check"><input id="randomBg" type="checkbox"> Указывать фон как случайный</label><textarea class="listingtext" id="listingText"></textarea><div class="modalactions"><button class="btn" id="refreshText">Сгенерировать через Gemini</button><button class="btn active" id="copyText">Копировать текст</button></div></div></div><script>
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:3});let token=sessionStorage.getItem('monoAdminToken')||'',view='all',inventoryItems=[],activeTextItem=null;const auth=()=>({'Authorization':'Bearer '+token});
function ask(){token=token||'';if(token)sessionStorage.setItem('monoAdminToken',token);return !!token}
function card(x){const listed=x.status==='listed',title=`${esc(x.model||'—')} × ${esc(x.backdrop||'—')}`,model=x.model_img||x.image_url||'',fallback=x.backdrop_hex||'#252831';return `<div class="card"><div class="visual" style="background:${esc(fallback)}">${x.bg_url?`<img class="back" src="${esc(x.bg_url)}" alt="" onerror="this.remove()">`:''}<img class="model" src="${esc(model)}" alt="" onerror="this.style.visibility='hidden'"></div><div><div class="name">${title}</div><div class="sub">${esc(x.collection||'')} ${x.symbol?'· '+esc(x.symbol):''}</div><div class="line"><span class="badge ${listed?'listed':''}">${listed?'Выставлен':'Инвентарь'}</span><span class="price">${x.price==null?'—':num(x.price)+' TON'}</span></div><div class="line actions"><button class="generate" onclick="generateGift(this,'${esc(x.market)}','${esc(x.id)}')">Сгенерировать ✦</button><button class="copytext" onclick="openListingText('${esc(x.market)}','${esc(x.id)}')">Текст</button>${x.generated_url?`<a class="generated" target="_blank" href="${esc(x.generated_url)}">Последняя ↗</a>`:''}</div><div class="line foot"><span class="sub">${esc(x.market.toUpperCase())}</span><a class="open" target="_blank" rel="noopener" href="${esc(x.gift_url)}">Открыть ↗</a></div></div></div>`}
async function load(forceKey=false){if(forceKey||!token){if(!ask())return}const q=new URLSearchParams({view});if($('market').value)q.set('market',$('market').value);const r=await fetch('/api/inventory?'+q,{headers:auth()}),d=await r.json();if(r.status===401){sessionStorage.removeItem('monoAdminToken');token='';return load(true)}if(!r.ok)throw Error(d.detail||'Ошибка');$('summary').innerHTML=Object.entries(d.markets).map(([k,v])=>`<div class="sum"><strong>${k.toUpperCase()} <span>${v.inventory_count+v.listed_count}</span></strong><small>Инвентарь: ${v.inventory_count} · выставлено: ${v.listed_count}${v.error?' · ошибка обновления':''}</small></div>`).join('')+`<div class="sum"><strong>AI-ГЕНЕРАЦИЯ <span>${d.generation.count}</span></strong><small>${num(d.generation.used_neurons)} / ${num(d.generation.daily_limit_neurons)} Neurons · осталось ${num(d.generation.remaining_neurons)}</small><small>Gemini 3.5: ${d.generation.gemini.models['gemini-3.5-flash-lite'].count}/500 · Gemini 3.1: ${d.generation.gemini.models['gemini-3.1-flash-lite'].count}/500</small><div class="meter"><i style="width:${Math.min(100,d.generation.percent_used)}%"></i></div></div>`;inventoryItems=d.items;$('grid').innerHTML=d.items.map(card).join('');$('empty').style.display=d.items.length?'none':'block';$('empty').textContent='Здесь пока нет подарков';}
function rounded99(value,step=100){return Math.max(99,Math.ceil(Number(value||0)/step)*step-1)}
async function buildListingText(){
 if(!activeTextItem)return;
 const x=activeTextItem,rate=Math.max(1,Number($('rubTon').value)||130),mult=Math.max(1,Number($('priceMult').value)||1),ton=Math.max(0,Number(x.price??x.floor??0)),sale=rounded99(ton*rate*mult),btn=$('refreshText');
 localStorage.setItem('listingRubTon',rate);localStorage.setItem('listingPriceMult',mult);btn.disabled=true;btn.textContent='Gemini анализирует цвет…';$('copyText').disabled=true;$('listingText').value=`Gemini изучает модель ${x.model||''} и точный фон ${x.backdrop||''}…`;
 try{const r=await fetch('/api/inventory/listing-text',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({market:x.market,item_id:String(x.id),sale_price:sale,random_bg:$('randomBg').checked})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Ошибка генерации текста');$('listingText').value=d.text}
 catch(e){$('listingText').value='Ошибка: '+e.message;alert(e.message)}finally{btn.disabled=false;btn.textContent='Сгенерировать через Gemini';$('copyText').disabled=false}
}
async function openListingText(market,id){
 activeTextItem=inventoryItems.find(x=>String(x.market)===String(market)&&String(x.id)===String(id));if(!activeTextItem)return alert('Подарок не найден');
 $('rubTon').value=localStorage.getItem('listingRubTon')||130;localStorage.removeItem('listingPriceMult');$('priceMult').value=1;$('randomBg').checked=false;$('textModal').classList.add('show');await buildListingText();
}
$('closeText').onclick=()=>$('textModal').classList.remove('show');$('textModal').onclick=e=>{if(e.target===$('textModal'))$('textModal').classList.remove('show')};$('refreshText').onclick=buildListingText;$('copyText').onclick=async()=>{await navigator.clipboard.writeText($('listingText').value);const b=$('copyText'),old=b.textContent;b.textContent='Скопировано ✓';setTimeout(()=>b.textContent=old,1400)};
function openGenerationWindow(){
 const tab=window.open('','_blank');if(!tab)return null;
 tab.document.open();tab.document.write(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Генерация изображения…</title><style>
 :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 28% 18%,#223d4d 0,transparent 36%),radial-gradient(circle at 75% 75%,#183b32 0,transparent 38%),#0e1012;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(520px,calc(100vw - 32px));padding:34px;border:1px solid rgba(255,255,255,.13);border-radius:22px;background:rgba(25,27,30,.86);box-shadow:0 30px 90px rgba(0,0,0,.48);backdrop-filter:blur(18px)}.orb{width:70px;height:70px;margin:0 auto 24px;border-radius:50%;background:conic-gradient(from 0deg,#5e9fe8,#72bc8f,#b6f2ff,#5e9fe8);animation:spin 2.2s linear infinite;box-shadow:0 0 42px rgba(94,159,232,.4)}.orb:after{content:"";display:block;width:48px;height:48px;transform:translate(11px,11px);border-radius:50%;background:#171a1d}.title{text-align:center;font-size:24px;font-weight:900}.status{height:22px;margin:9px 0 22px;text-align:center;color:#b7bcc5}.track{height:12px;padding:2px;border-radius:99px;background:#292d32;box-shadow:inset 0 1px 4px #000}.bar{height:100%;width:4%;border-radius:99px;background:linear-gradient(90deg,#5e9fe8,#72bc8f,#c4f8ff);box-shadow:0 0 18px rgba(114,188,143,.55);transition:width .7s ease}.row{display:flex;justify-content:space-between;margin-top:10px;color:#858b95;font-size:13px}.pct{color:#bcebd0;font-weight:800}@keyframes spin{to{transform:rotate(360deg)}}
 </style></head><body><main class="card"><div class="orb"></div><div class="title">Создаю оформление ✦</div><div class="status" id="status">Подготавливаю модель и фон…</div><div class="track"><div class="bar" id="bar"></div></div><div class="row"><span>Окно обновится автоматически</span><span class="pct" id="pct">4%</span></div></main><div class="modal" id="textModal"><div class="modalbox"><div class="modaltop"><h2>Текст объявления</h2><button class="x" id="closeText">×</button></div><div class="settings"><label class="field">Курс расчёта, ₽<input id="rubTon" type="number" min="1" step="1" value="130"></label><label class="field">Коэффициент цены<input id="priceMult" type="number" min="1" step="0.05" value="1"></label></div><label class="check"><input id="randomBg" type="checkbox"> Указывать фон как случайный</label><textarea class="listingtext" id="listingText"></textarea><div class="modalactions"><button class="btn" id="refreshText">Сгенерировать через Gemini</button><button class="btn active" id="copyText">Копировать текст</button></div></div></div><script>window.setGenerationProgress=(p,t)=>{document.getElementById('bar').style.width=p+'%';document.getElementById('pct').textContent=Math.round(p)+'%';if(t)document.getElementById('status').textContent=t};<\/script></body></html>`);tab.document.close();return tab;
}
async function generateGift(btn,market,item_id){
 const old=btn.textContent,tab=openGenerationWindow();let progress=4;
 const phases=[[18,'Анализирую тематику…'],[36,'Строю сцену и освещение…'],[58,'Генерирую детали…'],[76,'Накладываю точную модель…'],[88,'Проверяю результат…']];
 const started=Date.now();
 const timer=setInterval(()=>{const elapsed=(Date.now()-started)/1000;const target=Math.min(88,4+elapsed*2.15);progress=Math.max(progress,Math.min(target,progress+3));const phase=phases.find(x=>progress<x[0])||phases[phases.length-1];if(tab&&!tab.closed)tab.setGenerationProgress?.(progress,phase[1]);btn.textContent=`Генерация ${Math.round(progress)}%`;},700);
 btn.disabled=true;btn.textContent='Генерация 4%';
 try{
  const r=await fetch('/api/inventory/generate',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({market,item_id})}),d=await r.json();
  if(!r.ok)throw Error(d.detail||'Ошибка генерации');
  if(tab&&!tab.closed){tab.setGenerationProgress?.(100,'Готово! Открываю изображение…');setTimeout(()=>tab.location.replace(d.url),450)}else window.open(d.url,'_blank');
  await load();
 }catch(e){
  if(tab&&!tab.closed){tab.document.getElementById('status').textContent='Ошибка: '+e.message;tab.document.getElementById('bar').style.background='#e97366';tab.document.getElementById('bar').style.width='100%';tab.document.getElementById('pct').textContent='Ошибка'}
  alert(e.message);
 }finally{clearInterval(timer);btn.disabled=false;btn.textContent=old}
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));load().catch(e=>{$('empty').style.display='block';$('empty').textContent=e.message})});
$('market').onchange=()=>load().catch(()=>{});$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('key').onclick=()=>load(true).catch(e=>alert(e.message));load().catch(e=>{$('empty').textContent=e.message;$('empty').classList.add('error')});setInterval(()=>load().catch(()=>{}),30000);
</script></body></html>
